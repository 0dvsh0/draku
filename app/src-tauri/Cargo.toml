[package]
name = "draku"
version = "0.1.0"
description = "Your files, finally understood. On-device AI file manager."
authors = ["Draku"]
license = "MIT"
edition = "2021"
rust-version = "1.85"

[lib]
name = "draku_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
walkdir = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
regex = "1"
once_cell = "1"

image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
kamadak-exif = "0.6"
pdf-extract = "0.9"

# On-device embeddings: EmbeddingGemma-300M (4-bit ONNX), bundled in the
# installer. A dev checkout without the bundled copy fetches it once into the
# local cache; a packaged app makes no network request at all.
fastembed = "5"

# Local PaddleOCR (ONNX Runtime). Ships enabled in desktop builds because
# Protect needs pixel positions; `--no-default-features` keeps a light build.
# Vendored Apache-2.0 copy: upstream 0.6.1 is pinned to the old `ort` rc.10
# API, while fastembed's EmbeddingGemma-Q4 needs rc.13. The patch is limited
# to those two API changes (see vendor/paddle-ocr-rs/README.draku.md).
paddle-ocr-rs = { path = "vendor/paddle-ocr-rs", optional = true }

[features]
default = ["ocr"]
ocr = ["dep:paddle-ocr-rs"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
