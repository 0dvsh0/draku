name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: frontend (tsc, vitest, vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npx vitest run
      - run: npx vite build

  rust:
    name: rust core (light + OCR)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Cache EmbeddingGemma model
        uses: actions/cache@v4
        id: model-cache
        with:
          path: app/src-tauri/resources/models/embeddinggemma
          key: embeddinggemma-300m-q4-v1
      - name: Fetch model if not cached
        if: steps.model-cache.outputs.cache-hit != 'true'
        working-directory: app
        run: node scripts/fetch-model.mjs
      - name: Light build (no OCR)
        run: cargo test --locked --no-default-features
      - name: Full build (PaddleOCR)
        run: cargo test --locked --features ocr

  package:
    name: desktop packaging (NSIS + smoke test)
    needs: [web, rust]
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Cache EmbeddingGemma model
        uses: actions/cache@v4
        id: model-cache
        with:
          path: app/src-tauri/resources/models/embeddinggemma
          key: embeddinggemma-300m-q4-v1
      - name: Fetch model if not cached
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: node scripts/fetch-model.mjs
      - run: npm ci
      - name: Build NSIS installer
        run: npx tauri build
      - name: Install smoke test
        run: node scripts/smoke-test-installer.mjs
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Draku-Windows-Installer
          path: app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
