name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: frontend (tsc, vitest, vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npx vitest run
      - run: npx vite build

  rust:
    name: rust core (light + OCR)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Cache EmbeddingGemma model
        uses: actions/cache@v4
        id: model-cache
        with:
          path: app/src-tauri/resources/models/embeddinggemma
          key: embeddinggemma-300m-q4-v1
      - name: Fetch model if not cached
        if: steps.model-cache.outputs.cache-hit != 'true'
        working-directory: app
        run: node scripts/fetch-model.mjs
      - name: Compile light tests (no-run)
        run: cargo test --locked --no-default-features --no-run
      - name: Stage DirectML for tests
        shell: pwsh
        run: |
          # Test binaries statically import DirectML.dll (ort's prebuilt ONNX
          # Runtime with the DirectML execution provider); runners have no
          # system copy. The Windows loader resolves static imports through
          # PATH, so we extract the DLL into a clean step-owned directory and
          # append it to PATH via $GITHUB_ENV - no writes into the (cache
          # restored) target tree are required for loading. A best-effort copy
          # beside the binaries is kept as extra insurance.
          $ErrorActionPreference = "Stop"
          $dml = Join-Path $env:GITHUB_WORKSPACE "dml-stage"
          New-Item -ItemType Directory -Force -Path $dml | Out-Null

          $cache = Join-Path $env:USERPROFILE ".cache"
          $cache = Join-Path $cache "ort"
          $dll = $null
          if (Test-Path -LiteralPath $cache) {
            $dll = Get-ChildItem -LiteralPath $cache -Recurse -Filter "DirectML.dll" -ErrorAction SilentlyContinue | Where-Object { $_.Length -gt 10000000 } | Select-Object -First 1
          }
          if (-not $dll) {
            Write-Output "downloading pinned Microsoft.AI.DirectML 1.15.4 from NuGet"
            $pkg = Join-Path $env:TEMP "directml-1.15.4.nupkg"
            Invoke-WebRequest -Uri "https://api.nuget.org/v3-flatcontainer/microsoft.ai.directml/1.15.4/microsoft.ai.directml.1.15.4.nupkg" -OutFile $pkg
            $ext = Join-Path $env:TEMP "directml-1.15.4"
            New-Item -ItemType Directory -Force -Path $ext | Out-Null
            tar.exe -xf $pkg -C $ext
            $dll = Get-ChildItem -LiteralPath $ext -Recurse -Filter "DirectML.dll" | Where-Object { $_.FullName -like "*x64*" } | Select-Object -First 1
            if (-not $dll) { $dll = Get-ChildItem -LiteralPath $ext -Recurse -Filter "DirectML.dll" | Select-Object -First 1 }
          }
          if (-not $dll) { throw "DirectML.dll could not be obtained" }
          Write-Output "found: $($dll.FullName) ($($dll.Length) bytes)"

          $dest = Join-Path $dml "DirectML.dll"
          Copy-Item -LiteralPath $dll.FullName -Destination $dest -Force
          if (-not (Test-Path -LiteralPath $dest)) { throw "copy into dml-stage failed: $dest" }
          Write-Output "staged: $dest ($((Get-Item -LiteralPath $dest).Length) bytes)"

          # GITHUB_ENV is a file when set; append the expanded PATH entry so
          # every later step (cargo test executables) resolves DirectML.dll.
          if ($env:GITHUB_ENV) {
            Add-Content -LiteralPath $env:GITHUB_ENV -Value "PATH=$dml"
            Write-Output "appended to PATH via GITHUB_ENV: $dml"
          }

          # Extra insurance: copy beside the test binaries too. Non-fatal so a
          # quirk in the cache-restored target tree can never block the run.
          try {
            $deps = Join-Path (Join-Path (Join-Path $env:GITHUB_WORKSPACE "app") "src-tauri") "target"
            $deps = Join-Path (Join-Path $deps "debug") "deps"
            if (Test-Path -LiteralPath (Join-Path $deps "..")) {
              [System.IO.File]::Copy($dest, (Join-Path $deps "DirectML.dll"), $true)
              Write-Output "also copied beside test binaries"
            }
          } catch {
            Write-Output "note: beside-binaries copy skipped: $($_.Exception.GetType().FullName): $($_.Exception.Message)"
          }
      - name: Light build (no OCR)
        run: cargo test --locked --no-default-features
      - name: Full build (PaddleOCR)
        run: cargo test --locked --features ocr

  package:
    name: desktop packaging (NSIS + smoke test)
    needs: [web, rust]
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Cache EmbeddingGemma model
        uses: actions/cache@v4
        id: model-cache
        with:
          path: app/src-tauri/resources/models/embeddinggemma
          key: embeddinggemma-300m-q4-v1
      - name: Fetch model if not cached
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: node scripts/fetch-model.mjs
      - run: npm ci
      - name: Stage DirectML into resources
        shell: pwsh
        run: |
          # tauri-build validates bundle.resources before compiling, so a real
          # (non-empty) DirectML.dll must exist in resources/ on a fresh runner.
          # prepare-bundle.mjs keeps this staged copy when ort has not placed
          # one beside the build output yet.
          $ErrorActionPreference = "Stop"
          $app = Join-Path $env:GITHUB_WORKSPACE "app"
          $resources = Join-Path $app "src-tauri"
          $resources = Join-Path $resources "resources"
          New-Item -ItemType Directory -Force -Path $resources | Out-Null

          $dest = Join-Path $resources "DirectML.dll"
          $staged = $false
          if (Test-Path -LiteralPath $dest) {
            $item = Get-Item -LiteralPath $dest
            $staged = $item.Length -gt 10000000
          }
          if (-not $staged) {
            Write-Output "downloading pinned Microsoft.AI.DirectML 1.15.4 from NuGet"
            $pkg = Join-Path $env:TEMP "directml-1.15.4.nupkg"
            Invoke-WebRequest -Uri "https://api.nuget.org/v3-flatcontainer/microsoft.ai.directml/1.15.4/microsoft.ai.directml.1.15.4.nupkg" -OutFile $pkg
            $ext = Join-Path $env:TEMP "directml-1.15.4"
            New-Item -ItemType Directory -Force -Path $ext | Out-Null
            tar.exe -xf $pkg -C $ext
            $dll = Get-ChildItem -LiteralPath $ext -Recurse -Filter "DirectML.dll" | Where-Object { $_.FullName -like "*x64*" } | Select-Object -First 1
            if (-not $dll) { $dll = Get-ChildItem -LiteralPath $ext -Recurse -Filter "DirectML.dll" | Select-Object -First 1 }
            if (-not $dll) { throw "DirectML.dll could not be obtained" }
            Write-Output "found: $($dll.FullName) ($($dll.Length) bytes)"
            try {
              Copy-Item -LiteralPath $dll.FullName -Destination $dest -Force -ErrorAction Stop
            } catch {
              Write-Output "Copy-Item failed ($($_.Exception.Message)); retrying via [IO.File]::Copy"
              [System.IO.File]::Copy($dll.FullName, $dest, $true)
            }
          }
          if (-not (Test-Path -LiteralPath $dest)) { throw "staged file missing: $dest" }
          $item = Get-Item -LiteralPath $dest
          Write-Output "resources/DirectML.dll ready: $dest ($($item.Length) bytes)"

          # Insurance for the release build and the installer smoke test: make
          # the DirectML host directory resolvable through PATH as well.
          $dml = Join-Path $env:GITHUB_WORKSPACE "dml-stage"
          New-Item -ItemType Directory -Force -Path $dml | Out-Null
          $dmlDest = Join-Path $dml "DirectML.dll"
          if (-not (Test-Path -LiteralPath $dmlDest)) {
            [System.IO.File]::Copy($dest, $dmlDest, $true)
          }
          if ($env:GITHUB_ENV) {
            Add-Content -LiteralPath $env:GITHUB_ENV -Value "PATH=$dml"
            Write-Output "appended to PATH via GITHUB_ENV: $dml"
          }
      - name: Build NSIS installer
        run: npm run tauri:release
      - name: Install smoke test
        run: npm run smoke:installer
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Draku-Windows-Installer
          path: app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
