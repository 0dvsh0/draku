name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: frontend (tsc, vitest, vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npx vitest run
      - run: npx vite build

  rust:
    name: rust core (light + OCR)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Cache EmbeddingGemma model
        uses: actions/cache@v4
        id: model-cache
        with:
          path: app/src-tauri/resources/models/embeddinggemma
          key: embeddinggemma-300m-q4-v1
      - name: Fetch model if not cached
        if: steps.model-cache.outputs.cache-hit != 'true'
        working-directory: app
        run: node scripts/fetch-model.mjs
      - name: Compile light tests (no-run)
        run: cargo test --locked --no-default-features --no-run
      - name: Stage DirectML beside test binaries
        shell: pwsh
        run: |
          # The test binaries statically import DirectML.dll (ort's prebuilt
          # ONNX Runtime with the DML execution provider). Runners have no
          # system copy: stage ort's own cached copy first, else the exact
          # pinned Microsoft.AI.DirectML version from NuGet.
          $ErrorActionPreference = "Stop"
          # this job runs with working-directory app/src-tauri
          $deps = Join-Path (Get-Location) "target/debug/deps"
          if (-not (Test-Path $deps)) { New-Item -ItemType Directory -Force $deps | Out-Null }
          $cache = Join-Path $env:USERPROFILE ".cache\ort"
          $dll = $null
          if (Test-Path $cache) {
            $dll = Get-ChildItem $cache -Recurse -Filter "DirectML.dll" -ErrorAction SilentlyContinue | Where-Object { $_.Length -gt 10000000 } | Select-Object -First 1
          }
          if (-not $dll) {
            Write-Output "downloading pinned Microsoft.AI.DirectML 1.15.4 from NuGet"
            $pkg = Join-Path $env:TEMP "directml-1.15.4.nupkg"
            Invoke-WebRequest -Uri "https://api.nuget.org/v3-flatcontainer/microsoft.ai.directml/1.15.4/microsoft.ai.directml.1.15.4.nupkg" -OutFile $pkg
            $ext = Join-Path $env:TEMP "directml-1.15.4"
            New-Item -ItemType Directory -Force $ext | Out-Null
            tar.exe -xf $pkg -C $ext
            $dll = Get-ChildItem $ext -Recurse -Filter "DirectML.dll" | Where-Object { $_.FullName -like "*x64*" } | Select-Object -First 1
          }
          if (-not $dll) { throw "DirectML.dll x64 could not be obtained" }
          Copy-Item $dll.FullName $deps -Force
          Write-Output "staged $($dll.FullName) -> $deps"
      - name: Light build (no OCR)
        run: cargo test --locked --no-default-features
      - name: Full build (PaddleOCR)
        run: cargo test --locked --features ocr

  package:
    name: desktop packaging (NSIS + smoke test)
    needs: [web, rust]
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Cache EmbeddingGemma model
        uses: actions/cache@v4
        id: model-cache
        with:
          path: app/src-tauri/resources/models/embeddinggemma
          key: embeddinggemma-300m-q4-v1
      - name: Fetch model if not cached
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: node scripts/fetch-model.mjs
      - run: npm ci
      - name: Stage DirectML into resources
        shell: pwsh
        run: |
          # tauri-build validates bundle.resources before compiling, so a real
          # (non-empty) DirectML.dll must exist in resources/ on a fresh runner.
          # prepare-bundle.mjs keeps this staged copy when ort has not placed
          # one beside the build output yet.
          $ErrorActionPreference = "Stop"
          # this job runs with working-directory app
          $dest = Join-Path (Get-Location) "src-tauri/resources/DirectML.dll"
          New-Item -ItemType Directory -Force (Join-Path (Get-Location) "src-tauri/resources") | Out-Null
          $staged = $false
          if (Test-Path $dest) { $staged = (Get-Item $dest).Length -gt 10000000 }
          if (-not $staged) {
            Write-Output "downloading pinned Microsoft.AI.DirectML 1.15.4 from NuGet"
            $pkg = Join-Path $env:TEMP "directml-1.15.4.nupkg"
            Invoke-WebRequest -Uri "https://api.nuget.org/v3-flatcontainer/microsoft.ai.directml/1.15.4/microsoft.ai.directml.1.15.4.nupkg" -OutFile $pkg
            $ext = Join-Path $env:TEMP "directml-1.15.4"
            New-Item -ItemType Directory -Force $ext | Out-Null
            tar.exe -xf $pkg -C $ext
            $dll = Get-ChildItem $ext -Recurse -Filter "DirectML.dll" | Where-Object { $_.FullName -like "*x64*" } | Select-Object -First 1
            if (-not $dll) { throw "DirectML.dll x64 could not be obtained" }
            Copy-Item $dll.FullName $dest -Force
            Write-Output "staged $($dll.FullName) -> $dest"
          } else {
            Write-Output "resources/DirectML.dll already staged"
          }
      - name: Build NSIS installer
        run: npm run tauri:release
      - name: Install smoke test
        run: npm run smoke:installer
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Draku-Windows-Installer
          path: app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
