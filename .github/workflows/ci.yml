name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: frontend (tsc, vitest, vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npx vitest run
      - run: npx vite build

  rust:
    name: rust core (light + OCR)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Cache EmbeddingGemma model
        uses: actions/cache@v4
        id: model-cache
        with:
          path: app/src-tauri/resources/models/embeddinggemma
          key: embeddinggemma-300m-q4-v1
      - name: Fetch model if not cached
        if: steps.model-cache.outputs.cache-hit != 'true'
        working-directory: app
        run: node scripts/fetch-model.mjs
      - name: Compile light tests (no-run)
        run: cargo test --locked --no-default-features --no-run
      - name: Stage DirectML for tests
        shell: pwsh
        run: |
          # Test binaries statically import DirectML.dll (ort's prebuilt ONNX
          # Runtime with the DirectML execution provider); runners have no
          # system copy. Stage the DLL OUTSIDE the workspace (this image's
          # workspace sandbox blocks managed-code writes into cache-restored
          # dirs) and add it to PATH as the first directory, written as a FULL
          # path because this runner replaces GITHUB_ENV PATH entries rather
          # than appending. A native-tool fallback copies it beside the
          # binaries as extra insurance.
          $ErrorActionPreference = "Stop"
          $stage = Join-Path $env:USERPROFILE "dml-stage"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          $cache = Join-Path $env:USERPROFILE ".cache"
          $cache = Join-Path $cache "ort"
          $dll = $null
          if (Test-Path -LiteralPath $cache) {
            $dll = Get-ChildItem -LiteralPath $cache -Recurse -Filter "DirectML.dll" -ErrorAction SilentlyContinue | Where-Object { $_.Length -gt 10000000 } | Select-Object -First 1
          }
          if (-not $dll) {
            Write-Output "downloading pinned Microsoft.AI.DirectML 1.15.4 from NuGet"
            $pkg = Join-Path $env:TEMP "directml-1.15.4.nupkg"
            Invoke-WebRequest -Uri "https://api.nuget.org/v3-flatcontainer/microsoft.ai.directml/1.15.4/microsoft.ai.directml.1.15.4.nupkg" -OutFile $pkg
            $ext = Join-Path $env:TEMP "directml-1.15.4"
            New-Item -ItemType Directory -Force -Path $ext | Out-Null
            tar.exe -xf $pkg -C $ext
            $dll = Get-ChildItem -LiteralPath $ext -Recurse -Filter "DirectML.dll" | Where-Object { $_.FullName -like "*x64*" } | Select-Object -First 1
            if (-not $dll) { $dll = Get-ChildItem -LiteralPath $ext -Recurse -Filter "DirectML.dll" | Select-Object -First 1 }
          }
          if (-not $dll) { throw "DirectML.dll could not be obtained" }
          Write-Output "found: $($dll.FullName) ($($dll.Length) bytes)"

          Copy-Item -LiteralPath $dll.FullName -Destination (Join-Path $stage "DirectML.dll") -Force
          $stagedFile = Get-Item -LiteralPath (Join-Path $stage "DirectML.dll")
          if ($stagedFile.Length -lt 10000000) { throw "staged DirectML.dll too small" }
          Write-Output "staged outside workspace: $($stagedFile.FullName) ($($stagedFile.Length) bytes)"

          if ($env:GITHUB_ENV) {
            Add-Content -LiteralPath $env:GITHUB_ENV -Value "PATH=$stage;$env:PATH"
            Write-Output "wrote full PATH via GITHUB_ENV (stage first)"
          }

          # Insurance: copy beside the test binaries using a NATIVE tool
          # (robocopy), which is not subject to the sandbox quirk that
          # affects pwsh/.NET writes in the restored target tree. Non-fatal.
          try {
            $deps = Join-Path $env:GITHUB_WORKSPACE "app"
            $deps = Join-Path $deps "src-tauri"
            $deps = Join-Path $deps "target"
            $deps = Join-Path $deps "debug"
            $deps = Join-Path $deps "deps"
            robocopy $stage $deps "DirectML.dll" /NJH /NJS /NP | Out-Null
            if ((Test-Path -LiteralPath (Join-Path $deps "DirectML.dll")) -and ((Get-Item -LiteralPath (Join-Path $deps "DirectML.dll")).Length -gt 10000000)) {
              Write-Output "also staged beside test binaries"
            } else {
              Write-Output "note: beside-binaries robocopy did not land; relying on PATH"
            }
          } catch {
            Write-Output "note: beside-binaries copy skipped: $($_.Exception.Message)"
          }
      - name: Light build (no OCR)
        run: cargo test --locked --no-default-features
      - name: Full build (PaddleOCR)
        run: cargo test --locked --features ocr

  package:
    name: desktop packaging (NSIS + smoke test)
    needs: [web, rust]
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Cache EmbeddingGemma model
        uses: actions/cache@v4
        id: model-cache
        with:
          path: app/src-tauri/resources/models/embeddinggemma
          key: embeddinggemma-300m-q4-v1
      - name: Fetch model if not cached
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: node scripts/fetch-model.mjs
      - run: npm ci
      - name: Stage DirectML into resources
        shell: pwsh
        run: |
          # tauri-build validates bundle.resources before compiling, so a real
          # (non-empty) DirectML.dll must exist in resources/ on a fresh runner.
          # The DLL is acquired once into a directory OUTSIDE the workspace
          # (this image's workspace sandbox blocks managed-code writes) and
          # then placed into resources/ via a native-tool fallback chain,
          # because native tools are unaffected by that quirk.
          $ErrorActionPreference = "Stop"
          $stage = Join-Path $env:USERPROFILE "dml-stage"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          $hostDll = Join-Path $stage "DirectML.dll"
          if (-not ((Test-Path -LiteralPath $hostDll)) -or ((Get-Item -LiteralPath $hostDll).Length -lt 10000000)) {
            $cache = Join-Path $env:USERPROFILE ".cache"
            $cache = Join-Path $cache "ort"
            $dll = $null
            if (Test-Path -LiteralPath $cache) {
              $dll = Get-ChildItem -LiteralPath $cache -Recurse -Filter "DirectML.dll" -ErrorAction SilentlyContinue | Where-Object { $_.Length -gt 10000000 } | Select-Object -First 1
            }
            if (-not $dll) {
              Write-Output "downloading pinned Microsoft.AI.DirectML 1.15.4 from NuGet"
              $pkg = Join-Path $env:TEMP "directml-1.15.4.nupkg"
              Invoke-WebRequest -Uri "https://api.nuget.org/v3-flatcontainer/microsoft.ai.directml/1.15.4/microsoft.ai.directml.1.15.4.nupkg" -OutFile $pkg
              $ext = Join-Path $env:TEMP "directml-1.15.4"
              New-Item -ItemType Directory -Force -Path $ext | Out-Null
              tar.exe -xf $pkg -C $ext
              $dll = Get-ChildItem -LiteralPath $ext -Recurse -Filter "DirectML.dll" | Where-Object { $_.FullName -like "*x64*" } | Select-Object -First 1
              if (-not $dll) { $dll = Get-ChildItem -LiteralPath $ext -Recurse -Filter "DirectML.dll" | Select-Object -First 1 }
            }
            if (-not $dll) { throw "DirectML.dll could not be obtained" }
            Write-Output "found: $($dll.FullName) ($($dll.Length) bytes)"
            Copy-Item -LiteralPath $dll.FullName -Destination $hostDll -Force
          }
          if ((Get-Item -LiteralPath $hostDll).Length -lt 10000000) { throw "staged DirectML.dll too small" }
          Write-Output "host staged: $hostDll ($((Get-Item -LiteralPath $hostDll).Length) bytes)"

          $app = Join-Path $env:GITHUB_WORKSPACE "app"
          $resources = Join-Path $app "src-tauri"
          $resources = Join-Path $resources "resources"
          New-Item -ItemType Directory -Force -Path $resources | Out-Null
          $dest = Join-Path $resources "DirectML.dll"

          if (-not (Test-Path -LiteralPath $dest)) {
            $placed = $false
            try {
              Copy-Item -LiteralPath $hostDll -Destination $dest -Force -ErrorAction Stop
              $placed = Test-Path -LiteralPath $dest
              Write-Output "placed via Copy-Item: $placed"
            } catch {
              Write-Output "Copy-Item failed: $($_.Exception.Message)"
            }
            if (-not $placed) {
              try {
                [System.IO.File]::Copy($hostDll, $dest, $true)
                $placed = Test-Path -LiteralPath $dest
                Write-Output "placed via [IO.File]::Copy: $placed"
              } catch {
                Write-Output "[IO.File]::Copy failed: $($_.Exception.Message)"
              }
            }
            if (-not $placed) {
              robocopy $stage $resources "DirectML.dll" /NJH /NJS /NP | Out-Null
              $placed = (Test-Path -LiteralPath $dest) -and ((Get-Item -LiteralPath $dest).Length -gt 10000000)
              Write-Output "placed via robocopy: $placed"
            }
            if (-not $placed) {
              cmd /c copy /Y "$hostDll" "$dest" | Out-Null
              $placed = (Test-Path -LiteralPath $dest) -and ((Get-Item -LiteralPath $dest).Length -gt 10000000)
              Write-Output "placed via cmd copy: $placed"
            }
            if (-not $placed) { throw "could not place DirectML.dll into resources/" }
          }

          $item = Get-Item -LiteralPath $dest
          if ($item.Length -lt 10000000) { throw "resources DirectML.dll too small" }
          Write-Output "resources/DirectML.dll ready: $dest ($($item.Length) bytes)"

          if ($env:GITHUB_ENV) {
            Add-Content -LiteralPath $env:GITHUB_ENV -Value "PATH=$stage;$env:PATH"
            Write-Output "wrote full PATH via GITHUB_ENV (stage first)"
          }
      - name: Build NSIS installer
        run: npm run tauri:release
      - name: Install smoke test
        run: npm run smoke:installer
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Draku-Windows-Installer
          path: app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
